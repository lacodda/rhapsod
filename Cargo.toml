[package]
name = "rhapsod"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
description = "A self-hosted reader for a markdown library: progress, notes and spaced repetition"
license = "MIT"
repository = "https://github.com/lacodda/rhapsod"
homepage = "https://github.com/lacodda/rhapsod"
readme = "README.md"
keywords = ["reader", "markdown", "notes", "spaced-repetition", "self-hosted"]
categories = ["web-programming::http-server"]
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
# Not published to crates.io: the product is a container image and a compose
# file. Kept anyway so `cargo package` stays honest about what the crate is.
publish = false
exclude = [
    "docs/",
    "web/",
    ".github/",
    "cliff.toml",
    "rustfmt.toml",
    "assets/screenshot.png",
    "assets/social-preview.png",
    "assets/logo-512.png",
    "assets/apple-touch-icon.png",
    "assets/favicon-32.png",
]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
rand = "0.10.2"
rpassword = "7.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
