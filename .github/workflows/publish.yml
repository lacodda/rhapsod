name: Publish

# The container image, published alongside the release it belongs to. rhapsod
# is not a crate anyone installs: the product is an image and a compose file,
# so this is the whole of publishing.
#
# Triggered by the tag push directly (not the release event): releases are
# created by release.yml with GITHUB_TOKEN, and such events do not start other
# workflows.
on:
  push:
    tags: ['v*']
  # Buildable by hand, because a failure here must not need a new tag to retry.
  workflow_dispatch:

permissions:
  contents: read
  # Pushing to GHCR is done with the workflow's own token: no registry password
  # to store, and nothing to rotate.
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Nothing goes to the registry before the release is out: a tag whose
  # archives failed to build must not move `latest` on the stand's registry.
  # Every job below needs this one.
  release:
    name: Wait for the release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 90
    steps:
      - name: Wait for release.yml on the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          started=$(date +%s)
          while :; do
            run=$(gh run list --workflow release.yml --commit "$sha" --limit 1 \
              --json status,conclusion,url --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "none") \(.url // "-")"')
            read -r status conclusion url <<< "$run"
            case "$status/$conclusion" in
              completed/success) echo "release.yml put $TAG out: $url"; exit 0 ;;
              completed/*) echo "release.yml ended '$conclusion' for $TAG: $url" >&2; exit 1 ;;
              none/*)
                if [ $(( $(date +%s) - started )) -gt 600 ]; then
                  echo "release.yml has not started for $TAG in ten minutes" >&2
                  exit 1
                fi
                ;;
            esac
            sleep 30
          done

  build:
    name: ${{ matrix.platform }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # Native arm64 rather than emulation: a Rust build under QEMU takes
            # the better part of an hour, and this one has a Node stage too.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each runner pushes a digest rather than a tag; the manifest below is
      # what gives the two of them one name.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The file's name is the digest without its `sha256:` prefix, which is
      # what `imagetools create` wants back when it assembles the manifest.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Publish the manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves and the version does not: someone who pinned 0.1.0 gets
      # that image forever, and someone who wrote `latest` in a compose file
      # gets whatever shipped last.
      - name: Create the multi-architecture tag
        working-directory: /tmp/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"
